# ── Gates: the 2-D planes drainage crosses (drainage-canyons-gigawatts) ────────────
# Analysis GEOMETRY, not places: a gate is a line, has no station, and never joins a
# waypoint group. Walk a -> b so the RIGHTWARD normal points downstream (out of the
