# ── Aliases: surface state and surface energy balance (HRRR sfc) ────────────
# For cold-pool work: what the ground is (skin temperature, snow, lake ice) and what
# it exchanges with the air. Each search matches exactly one message at f00, f01,
# f02, f24 and f48 of the 2025-01-26 18Z HRRR sfc inventory (checked 2026-10-02 for
# ub-wx drainage-canyons-gigawatts, Iteration 5). WEASD is the trap: the pack on the
# ground shares its name with up to three snowfall accumulation buckets
# ("0-N hour acc", "N-1-N hour acc", "0-N day acc"), so the search pins the
# instantaneous forecast-time token. The radiation names are level-qualified because
# ULWRF and USWRF also exist at the top of the atmosphere. Fluxes are instantaneous
# and carry the signs HRRR ships: SHTFL and LHTFL positive upward (surface to air).

[aliases.temp_surface]
description = "Surface (skin) temperature"
units       = "K"
output_var  = "temp_surface"
[aliases.temp_surface.search]
hrrr = "TMP:surface"

[aliases.ice_cover]
description = "Ice cover on water, lakes included (fraction, 0-1)"
