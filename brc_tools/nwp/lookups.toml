# The Basin AIRSHED: the footprint-A analysis extent of ub-wx drainage-canyons-gigawatts
# (2026-09-14) -- every rim catchment, the Green River corridor to Flaming Gorge, the
# White / Yampa / Little Snake entries and the Book Cliffs. The [gates.*] table lives inside it.
